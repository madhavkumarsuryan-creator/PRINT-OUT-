function ppPick(raw){
 if(!/^image\//.test(raw.type||'')&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(raw.name||'')){bad('पासपोर्ट फ़ोटो के लिए फ़ोटो (JPG/PNG) चुनें।');return}
 reset();ppWait();
 ppLib().then(function(){
  pp.url=URL.createObjectURL(raw);var im=new Image();
  im.onload=function(){pp.img=im;setTimeout(ppBuild,60)};
  im.onerror=function(){reset();bad('यह फ़ोटो खुल नहीं पाई। कोई दूसरी फ़ोटो चुनें।')};
  im.src=pp.url;
 },function(){bad('फ़ोटो बनाने वाला हिस्सा लोड नहीं हुआ। पेज दोबारा खोलें।')});
}
function ppBuild(){
 try{var r=PP.make(pp.img,{bg:pp.bg});pp.photo=r.photo;pp.red=r.redBg;ppSheet()}
 catch(e){var keep=pp.img;reset();bad(e&&e.code=='noface'?'फ़ोटो में चेहरा साफ़ नहीं मिला। सामने देखती हुई, अच्छी रोशनी वाली, पास से खींची फ़ोटो चुनें।':'फ़ोटो नहीं बन पाई। कोई दूसरी फ़ोटो चुनें।')}
}
function ppSheet(){
 var A=PP.sheet(pp.photo);
 A.toBlob(function(b){
  if(!b){bad('फ़ोटो नहीं बन पाई। दोबारा कोशिश करें।');return}
  file=new File([b],'PassportPhoto_'+pp.n+'.jpg',{type:'image/jpeg'});pages=1;
  $('picks').style.display='none';$('pv').hidden=false;$('pin').innerHTML='';
  var c=pp.photo;c.id='ppc';c.style.maxWidth='100%';c.style.maxHeight='100%';$('pin').appendChild(c);
  $('ptag').textContent=pp.red?'सफ़ेद कपड़े → हल्का लाल बैकग्राउंड':'A4 पर 6 फ़ोटो (एक लाइन)';$('ptag').hidden=false;
  ovClose();rates();lock();
 },'image/jpeg',0.92);
}
[].forEach.call(document.querySelectorAll('.bgc'),function(b){b.onclick=function(){if(busy)return;pp.bg=b.getAttribute('data-bg');
 [].forEach.call(document.querySelectorAll('.bgc'),function(x){x.className='bgc'+(x===b?' on':'')});
 if(pp.img){ppWait();setTimeout(ppBuild,60)}}});

function sending(){ov('','📤','फ़ाइल भेज रहे हैं…','<div class="bar"><i id="pb"></i></div>')}
function prog(f){if($('pb'))$('pb').style.width=Math.round(f*100)+'%'}
function again(){if(busy)return;clearInterval(window.timer);ovClose();reset()}
$('del').onclick=again;$('x').onclick=again;

$('bw').onclick=function(){go(0)};$('col').onclick=function(){go(1)};
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
/* CP1 | ephemeral public point(65) | iv(12) | AES-GCM([2-byte header len][header "c|name"][file]) ; key = SHA-256("CSCP1"|ECDH secret) ; aad "CP1" */
function seal(fileBuf,name,color){
 var enc=new TextEncoder(),magic=enc.encode('CP1'),eph,shopPub,iv=crypto.getRandomValues(new Uint8Array(12)),ephRaw;
 return crypto.subtle.importKey('raw',unb64(P.k),{name:'ECDH',namedCurve:'P-256'},false,[])
 .then(function(k){shopPub=k;return crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits'])})
 .then(function(kp){eph=kp;return crypto.subtle.exportKey('raw',kp.publicKey)})
 .then(function(raw){ephRaw=new Uint8Array(raw);return crypto.subtle.deriveBits({name:'ECDH',public:shopPub},eph.privateKey,256)})
 .then(function(sh){var pre=enc.encode('CSCP1'),m=new Uint8Array(pre.length+32);m.set(pre,0);m.set(new Uint8Array(sh),pre.length);return crypto.subtle.digest('SHA-256',m)})
 .then(function(kb){return crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['encrypt'])})
 .then(function(ak){
   var hdr=enc.encode((color?'1':'0')+'|'+name),pt=new Uint8Array(2+hdr.length+fileBuf.byteLength);
   pt[0]=hdr.length>>8;pt[1]=hdr.length&255;pt.set(hdr,2);pt.set(new Uint8Array(fileBuf),2+hdr.length);
   return crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:magic,tagLength:128},ak,pt)})
 .then(function(ct){var out=new Uint8Array(3+65+12+ct.byteLength);out.set(magic,0);out.set(ephRaw,3);out.set(iv,68);out.set(new Uint8Array(ct),80);return out});
}
function send(method,url,body,hdr,progress){
 return new Promise(function(res,rej){
  var x=new XMLHttpRequest();x.open(method,url);
  if(hdr)x.setRequestHeader('Content-Type',hdr);
  x.upload.onprogress=function(e){if(e.lengthComputable)progress(e.loaded/e.total)};
  x.onload=function(){x.status>=200&&x.status<300?res():rej({status:x.status})};
  x.onerror=function(){rej({net:1})};x.ontimeout=x.onerror;x.timeout=240000;x.send(body);
 });
}
function sniff(buf){var b=new Uint8Array(buf.slice(0,8));
 if(b[0]==0x25&&b[1]==0x50&&b[2]==0x44&&b[3]==0x46)return 'pdf';
 if(b[0]==0xFF&&b[1]==0xD8&&b[2]==0xFF)return 'jpg';
 if(b[0]==0x89&&b[1]==0x50&&b[2]==0x4E&&b[3]==0x47)return 'png';return null}
(function(){
 var h=location.hash.replace(/^#/,''),q={};
 try{var sp=new URLSearchParams(h);sp.forEach(function(v,k){q[k]=v})}catch(e){}
 P.t=q.t||'';P.k=q.k||'';if(q.u&&/^https?:\/\//.test(q.u))P.u=q.u.replace(/\/+$/,'');
 P.ok=/^[A-Za-z0-9_-]{8,64}$/.test(P.t)&&/^[A-Za-z0-9_-]{80,100}$/.test(P.k);
 if(q.s){$('shop').textContent=q.s;document.title=q.s+' - Print'}
 if(q.p){var r=q.p.split(',');if(r.length>=2&&!isNaN(+r[0])&&!isNaN(+r[1])){info.rateBw=+r[0];info.rateColor=+r[1]}if(r.length>=3&&!isNaN(+r[2]))info.ratePP=+r[2]}
 rates();
 if(!P.ok){ready=false;$('warn').textContent='⚠ यह QR पूरा नहीं है। दुकान पर लगा QR दोबारा स्कैन करें।';$('warn').hidden=false}
 else if(!(window.crypto&&crypto.subtle)){ready=false;$('warn').textContent='⚠ यह फ़ोन/ब्राउज़र सुरक्षित भेजने को सपोर्ट नहीं करता। दुकान के WiFi वाला QR इस्तेमाल करें।';$('warn').hidden=false}
 lock();
})();
function go(color){
 if(!file||busy||!P.ok||!pageOk())return;busy=true;lock();sending();
 var name=file.name;
 file.arrayBuffer().then(function(buf){
  if(!sniff(buf))throw {msg:'सिर्फ़ PDF, JPG या PNG फ़ाइल चलेगी। यह फ़ाइल दूसरी तरह की है।'};
  return seal(buf,name,color)})
 .then(function(blob){
  var url=P.u+'/'+P.t+'?filename=job.bin';
  /* normal way first; if the browser blocks the "PUT", send the same thing as a plain POST */
  return send('PUT',url,blob,'application/octet-stream',prog).catch(function(e){
   if(e&&e.net)return send('POST',url,new Blob([blob],{type:'text/plain'}),'text/plain',prog);
   throw e})})
 .then(function(){
  busy=false;lock();
  ov('ok','✅','फ़ाइल भेज दी गई','दुकान के प्रिंटर से 1-2 मिनट में निकलेगी — काउंटर से ले लें।'+(mode=='pp'?'<br>पासपोर्ट फ़ोटो A4 शीट = <b>'+money(info.ratePP)+'</b>':pages?'<br>'+pages+' पेज × 1 = <b>'+money(pages*(color?info.rateColor:info.rateBw))+'</b>':''),[['🆕 New Print — दूसरी फ़ाइल',again]]);
 }).catch(function(e){
  busy=false;lock();
  if(e&&e.msg)bad(e.msg);
  else if(e&&e.status==413)bad('फ़ाइल बहुत बड़ी है। छोटी फ़ाइल भेजें।');
  else if(e&&e.status==429)bad('अभी बहुत भीड़ है। एक मिनट बाद दोबारा कोशिश करें।');
  else if(e&&e.status)bad('फ़ाइल नहीं जा पाई (कोड '+e.status+')। दोबारा कोशिश करें।');
  else bad('इंटरनेट चल नहीं रहा या फ़ाइल नहीं जा पाई। दोबारा कोशिश करें।');
 });
}
